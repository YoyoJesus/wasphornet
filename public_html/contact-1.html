                <h2>Contact Me</h2>
                <p>Feel free to reach out to me on any of the platforms above or fill out the form below to send me an email.</p>
                <form id="contact-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>
                    <input type="submit" value="Send">
                </form>

                <!-- Include Email.js SDK -->
                <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>

                <script type="text/javascript">
                    (function() {
                        emailjs.init("3eJOPD6v_R2iDRXy2");
                    })();

                    document.getElementById("contact-form").addEventListener("submit", function(event) {
                    event.preventDefault();

                    // Get form data
                    var name = document.getElementById("name").value;
                    var email = document.getElementById("email").value;
                    var message = document.getElementById("message").value;

                    // Send the email via Email.js
                    emailjs.send("service_hmukr8x", "template_f07pdtf", {
                        name: name,
                        email: email,
                        message: message
                    }).then(function(response) {
                        alert("Your message has been sent successfully!");
                        document.getElementById("contact-form").reset(); // Clear form
                    }, function(error) {
                        alert("Something went wrong. Please try again.");
                    });
                    });
                </script>
            </div>
